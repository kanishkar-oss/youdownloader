# Builds YouDownloader for Windows, Apple Silicon Macs and Intel Macs.
#
# - Push a tag vX.Y.Z (scripts/release.ps1 or release.sh does it) → builds all
#   three and publishes a GitHub Release with the installers. Installed copies
#   of the app see it on their next launch and offer to update.
# - Run it manually (Actions → Build & release → Run workflow) → test builds
#   only, downloadable from the run page; nothing is published.
name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest      # Apple Silicon (arm64)
            label: mac-apple-silicon
          - os: macos-15-intel    # Intel (x86_64)
            label: mac-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches src/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0, '.'); from src.version import __version__; print(__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match src/version.py ($v)"; exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          # Always ship the newest yt-dlp: YouTube changes often.
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco upgrade innosetup -y --no-progress

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build
        run: python packaging/build.py

      - name: Check the shipped Mac app (zip, dmg, self-test, update swap)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          sh packaging/ci_check_mac.sh 2>&1 | tee ci_check.log || status=$?
          # The run's summary page is public (logs need a sign-in), so failures can be read there.
          { echo "### ${{ matrix.label }}: $([ -z "${status:-}" ] && echo passed || echo FAILED)"
            echo '```'; grep -E '^(==|ok:|FAIL|PASS|WARN|RESULT|All macOS)|Error|error:' ci_check.log | head -60
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Annotations show on the run page even to visitors who aren't signed in.
          grep -E '^(FAIL|WARN) ' ci_check.log | head -5 | while IFS= read -r line; do
            echo "::warning title=${{ matrix.label }} self-test::${line:0:300}"
          done
          [ -z "${status:-}" ] || echo "::error title=${{ matrix.label }} checks failed::$(grep -E '^FAIL|FAIL:' ci_check.log | head -3 | tr '\n' ' ' | cut -c1-400)"
          exit ${status:-0}

      - name: Install the Windows build the way the updater does, then self-test it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/release/*-windows-setup.exe).FullName
          # Same silent flags as the in-app updater. WaitForExit (not -Wait,
          # which would also wait for the app the installer launches).
          $p = Start-Process $setup -PassThru -ArgumentList '/SILENT','/SP-','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS',"/LOG=$PWD\install.log"
          if (-not $p.WaitForExit(600000)) { throw "installer timed out" }
          Get-Content install.log -Tail 5
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          if (-not (Get-Process YouDownloader -ErrorAction SilentlyContinue)) { throw "the app didn't start after installing" }
          $exe = "$env:LOCALAPPDATA\Programs\YouDownloader\YouDownloader.exe"
          $t = Start-Process $exe -PassThru -ArgumentList '--self-test',"$PWD\selftest.txt"
          if (-not $t.WaitForExit(120000)) { throw "self-test timed out" }
          Get-Content selftest.txt
          # The run's summary page is public (logs need a sign-in).
          $verdict = if ($t.ExitCode -eq 0) { "passed" } else { "FAILED" }
          @("### windows: installed app self-test $verdict", '```') + (Get-Content selftest.txt | Select-String -Pattern '^(PASS|FAIL|WARN|RESULT)' | ForEach-Object { $_.Line }) + '```' |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          # Annotations show on the run page even to visitors who aren't signed in.
          Get-Content selftest.txt | Select-String -Pattern '^(FAIL|WARN) ' | Select-Object -First 5 |
            ForEach-Object { $l = $_.Line; if ($l.Length -gt 300) { $l = $l.Substring(0, 300) }; Write-Output "::warning title=windows self-test::$l" }
          if ($t.ExitCode -ne 0) { throw "self-test failed" }
          Stop-Process -Name YouDownloader -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v6
        with:
          name: YouDownloader-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Copies with permanent names (for links that never change)
        # releases/latest/download/<name> always serves the newest release, so
        # these names give testers one link per platform forever. The versioned
        # files stay too: installed apps' updaters look for those.
        run: |
          cd dist
          v="${GITHUB_REF_NAME#v}"
          for f in YouDownloader-"$v"-windows-setup.exe YouDownloader-"$v"-mac-apple-silicon.dmg YouDownloader-"$v"-mac-intel.dmg; do
            cp "$f" "${f/-$v/}"
          done
          ls -la

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The annotated tag's message (written by the release script) is the release notes.
          git fetch --force --tags
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          [ -n "$notes" ] || notes="YouDownloader ${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "YouDownloader ${GITHUB_REF_NAME#v}" \
            --notes "$notes"
